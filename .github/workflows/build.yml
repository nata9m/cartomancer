name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cartomancer
          POSTGRES_PASSWORD: cartomancer
          POSTGRES_DB: cartomancer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cartomancer -d cartomancer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cartomancer:cartomancer@localhost:5432/cartomancer?schema=public
      AUTH_SECRET: ci-only-secret-not-used-for-anything-real
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Before the seed: it imports the shared package's build output.
      - name: Build every package
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Apply migrations
        run: pnpm --filter @cartomancer/db migrate:deploy

      - name: Seed reference data
        run: pnpm --filter @cartomancer/db seed

      - name: API tests
        run: pnpm --filter @cartomancer/api test

      - name: Check SQL and TypeScript answer normalisation agree
        run: pnpm --filter @cartomancer/db verify:matching

  # The two images must carry the SAME timestamp tag for a commit: the cluster
  # picks the newest build by sorting that timestamp, and web and api are
  # deployed as a pair (the api image also runs the migrations), so a mismatched
  # pair is the schema/runtime split we are specifically avoiding. The matrix
  # jobs run in parallel, so each computing its own `date` would differ by
  # seconds — hence one stamp, computed once, shared by both.
  stamp:
    name: timestamp for this build
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.ts.outputs.ts }}
    steps:
      - id: ts
        run: echo "ts=$(date -u +%s)" >> "$GITHUB_OUTPUT"

  images:
    # Built on every push and pull request — the first run of these Dockerfiles
    # failed on a missing file that nothing else would have caught — but only
    # published from main.
    name: build ${{ matrix.app }} image
    needs: [verify, stamp]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Stop the sibling job as soon as one image fails, so a broken build is
      # less likely to publish half a pair.
      fail-fast: true
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/cartomancer-${{ matrix.app }}
          # Two tags, no :latest — everything downstream pins by digest.
          #   <short-sha>              e.g. abc1234 — for `kubectl set image`
          #   <unix-ts>-<short-sha>    e.g. 1758441419-abc1234 — sortable, and
          #                            what the cluster's image automation uses
          #                            to tell which build is newest, since bare
          #                            SHAs have no meaningful order.
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=${{ needs.stamp.outputs.ts }}-{{sha}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
