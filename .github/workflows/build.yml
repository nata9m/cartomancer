name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cartomancer
          POSTGRES_PASSWORD: cartomancer
          POSTGRES_DB: cartomancer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cartomancer -d cartomancer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cartomancer:cartomancer@localhost:5432/cartomancer?schema=public
      AUTH_SECRET: ci-only-secret-not-used-for-anything-real
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Before the seed: it imports the shared package's build output.
      - name: Build every package
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Apply migrations
        run: pnpm --filter @cartomancer/db migrate:deploy

      - name: Seed reference data
        run: pnpm --filter @cartomancer/db seed

      - name: API tests
        run: pnpm --filter @cartomancer/api test

      - name: Check SQL and TypeScript answer normalisation agree
        run: pnpm --filter @cartomancer/db verify:matching

  # One source of truth for both images' tags.
  #
  # The two images must carry the SAME timestamp tag for a commit: the cluster
  # picks the newest build by sorting that timestamp, and web and api are
  # deployed as a pair (the api image also runs the migrations), so a mismatched
  # pair is the schema/runtime split we are specifically avoiding. The build jobs
  # run in parallel and the publish job runs later, so each computing its own
  # `date` would differ by seconds — hence one stamp, computed once, read by
  # everything downstream.
  stamp:
    name: tags for this build
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.tags.outputs.ts }}
      short: ${{ steps.tags.outputs.short }}
    steps:
      - id: tags
        run: |
          set -euo pipefail
          {
            echo "ts=$(date -u +%s)"
            # Same 7 characters docker/metadata-action's `format=short` uses.
            echo "short=${GITHUB_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"

  # Build only — nothing here can reach the registry. Each image is written to a
  # local tarball and handed to the publish job, which needs BOTH of these jobs
  # to have succeeded before it logs in. That is the guarantee: a failing web
  # build cannot leave a published api image behind, because at the moment web
  # fails, nothing has been pushed at all.
  #
  # Runs on pull requests too — the first version of these Dockerfiles failed on
  # a missing file nothing else would have caught — but there the tarball is
  # simply thrown away.
  build:
    name: build ${{ matrix.app }} image
    needs: [verify, stamp]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TS: ${{ needs.stamp.outputs.ts }}
      SHORT: ${{ needs.stamp.outputs.short }}
    strategy:
      # Stop the sibling as soon as one image fails: neither is going to be
      # published, so the remaining build is wasted minutes.
      fail-fast: true
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/cartomancer-${{ matrix.app }}
          # Two tags, no :latest — everything downstream pins by digest.
          #   <short-sha>              e.g. abc1234 — for `kubectl set image`
          #   <unix-ts>-<short-sha>    e.g. 1758441419-abc1234 — sortable, and
          #                            what the cluster's image automation uses
          #                            to tell which build is newest, since bare
          #                            SHAs have no meaningful order.
          # Both come from the stamp job so the publish job can reconstruct them
          # from the same values.
          tags: |
            type=raw,value=${{ needs.stamp.outputs.short }}
            type=raw,value=${{ needs.stamp.outputs.ts }}-${{ needs.stamp.outputs.short }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          outputs: type=docker,dest=/tmp/${{ matrix.app }}.tar
          # The web image shows this in its footer, so it must be the same
          # seven characters the image is tagged with — hence the stamp job's
          # output rather than a second truncation of github.sha. Only web
          # declares the ARG; passing it to api as well would build fine but
          # log an unused-build-arg warning on every api build.
          build-args: ${{ matrix.app == 'web' && format('GIT_SHA={0}', needs.stamp.outputs.short) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # Pull requests never reach the publish job, so this is where the tag
      # reconstruction publish relies on gets exercised: same expression, no
      # registry involved. If the two ever drift, this fails on the PR rather
      # than on main.
      - name: Check the tarball carries exactly the tags publish will push
        run: |
          set -euo pipefail
          owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          repo="${REGISTRY}/${owner}/cartomancer-${{ matrix.app }}"
          docker load --input "/tmp/${{ matrix.app }}.tar"
          found=$(docker image inspect "${repo}:${SHORT}" --format '{{range .RepoTags}}{{println .}}{{end}}' | sed '/^$/d' | sort)
          expected=$(printf '%s:%s\n%s:%s-%s\n' "$repo" "$SHORT" "$repo" "$TS" "$SHORT" | sort)
          if [ "$found" != "$expected" ]; then
            echo "::error::tarball tags are not the tags publish would push"
            printf 'in the tarball:\n%s\nexpected:\n%s\n' "$found" "$expected"
            exit 1
          fi
          printf 'tarball tags:\n%s\n' "$found"

      # The web footer shows GIT_SHA, and the whole point is that it names the
      # image you are looking at. That only holds if the build arg reached the
      # runtime stage, which nothing else here would notice: a typo in the
      # Dockerfile's ARG or in the build-args expression builds perfectly well
      # and ships a footer reading "dev". The image is already loaded above.
      - name: Check the web image knows which commit it is
        if: ${{ matrix.app == 'web' }}
        run: |
          set -euo pipefail
          owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          baked=$(docker image inspect "${REGISTRY}/${owner}/cartomancer-web:${SHORT}" \
            --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^GIT_SHA=//p')
          if [ "$baked" != "$SHORT" ]; then
            echo "::error::web image has GIT_SHA=${baked:-<unset>}, expected ${SHORT}"
            exit 1
          fi
          echo "web image carries GIT_SHA=${baked}, matching its ${SHORT} tag"

      - name: Hand the image to the publish job
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.app }}
          path: /tmp/${{ matrix.app }}.tar
          # The layers inside are already compressed; zipping them again costs
          # minutes and saves nothing.
          compression-level: 0
          retention-days: 1

  # `needs: build` on a matrix means every leg succeeded, so this job existing at
  # all is the proof that both images built. It is the only job with packages:
  # write, and the first point in the workflow that touches ghcr.io.
  publish:
    name: publish both images
    needs: [stamp, build]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TS: ${{ needs.stamp.outputs.ts }}
      SHORT: ${{ needs.stamp.outputs.short }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: /tmp/images

      - name: Load both images before logging in
        run: |
          set -euo pipefail
          for app in web api; do
            docker load --input "/tmp/images/image-${app}/${app}.tar"
          done
          docker image ls

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push web and api
        run: |
          set -euo pipefail
          # metadata-action lowercases the image name; match it.
          owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          for app in web api; do
            repo="${REGISTRY}/${owner}/cartomancer-${app}"
            for tag in "${SHORT}" "${TS}-${SHORT}"; do
              docker push "${repo}:${tag}"
            done
          done

      - name: Check both images published the same pair of tags
        run: |
          set -euo pipefail
          owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          for app in web api; do
            repo="${REGISTRY}/${owner}/cartomancer-${app}"
            sha_digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${repo}:${SHORT}")
            ts_digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${repo}:${TS}-${SHORT}")
            if [ "$sha_digest" != "$ts_digest" ]; then
              echo "::error::${repo}: ${SHORT} is ${sha_digest} but ${TS}-${SHORT} is ${ts_digest}"
              exit 1
            fi
            echo "${repo}: ${SHORT} and ${TS}-${SHORT} both -> ${sha_digest}"
            echo "- \`${repo}\` \`${SHORT}\`, \`${TS}-${SHORT}\` → \`${sha_digest}\`" >> "$GITHUB_STEP_SUMMARY"
          done
